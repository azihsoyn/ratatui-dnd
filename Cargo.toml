[package]
name = "ratatui-dnd"
version = "0.1.0"
edition = "2024"
description = "Drag and drop for ratatui: attach sorting to lists you already draw, with mouse or keyboard"
license = "MIT OR Apache-2.0"
repository = "https://github.com/azihsoyn/ratatui-dnd"
exclude = ["demo.gif", ".github"]
keywords = ["ratatui", "tui", "drag-and-drop", "sortable", "terminal"]
categories = ["command-line-interface"]

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
