name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features serde -- -D warnings
      - run: cargo test --features serde
      - run: cargo test
      - run: cargo build --examples --features serde
      - run: |
          echo '{"board":[{"title":"todo","cards":["a","b"]},{"title":"done","cards":[]}],"script":[{"down":[2,1]},{"drag":[33,2]},{"up":[33,2]}]}' \
            | cargo run -q --example headless --features serde
